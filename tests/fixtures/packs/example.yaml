name: example-counter
description: Synthetic pack for loader tests only. F190 is the standard VIN identifier; it is reused here as a test counter, not a real counter address.
match:
  wmi: ["4T1"]
  year_from: 2014
  year_to: 2014
dids:
  - ecu: "7E0"
    id: "F190"
    name: pack_counter
    formula: "A * 256 + B"
    unit: count
    vss: Vehicle.Demo.Counter
    description: Two-byte synthetic counter.
