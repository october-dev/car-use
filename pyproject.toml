[project]
name = "car-use"
dynamic = ["version"]
description = "Let your agent use your car."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

authors = [{ name = "October" }]
keywords = ["car", "obd2", "elm327", "can-bus", "automotive", "ai-agents", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://car-use.dev"
Repository = "https://github.com/october-dev/car-use"
Issues = "https://github.com/october-dev/car-use/issues"
Changelog = "https://github.com/october-dev/car-use/blob/main/CHANGELOG.md"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.22"]

[project.scripts]
car-use = "car_use.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/car_use/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/car_use"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "car_use/SKILL.md"
"scenarios" = "car_use/scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]
