[project]
name = "car-use"
version = "0.0.1"
description = "Let your agent use your car."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.22"]

[project.scripts]
car-use = "car_use.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_use"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "car_use/SKILL.md"
"scenarios" = "car_use/scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]
