notes = """P0128 coolant thermostat below regulating temperature. The engine has
already been idling for about 15 minutes and the coolant is still far below
the ~88 C a closed thermostat holds. It climbs only a few degrees over the
next 15 minutes. A thermostat stuck open, a missing thermostat, or a coolant
temperature sensor reading low all look like this; the sensor is the one to
check first if the heater is actually hot."""

