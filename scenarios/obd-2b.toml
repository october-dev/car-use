notes = """2025 Honda Activa, OBD Stage II-B. The engine is air-cooled, so `coolant` here
is the engine temperature sensor, not a coolant reading. This simplified teaching profile
answers rpm, speed, coolant, throttle, runtime and the 12 V supply, plus the
continuous monitors. It does not answer oxygen sensors, fuel trims, MAF or
the catalyst/evap/o2 monitors. That small map is this profile's scope, not a
rule of the standard: Stage II-B requires catalyst monitoring, so a real 2025
Activa may report catalyst readiness this profile omits. Nothing is wrong with
this one. Do not diagnose unanswered sensors as a fault."""

[car]
name = "2025 Honda Activa OBD2B (sim)"
vin = "ME4JC5AA3SA200002"
protocol = "6"

[adapter]
profile = "clone"

[signals]
rpm = { value = 1700, jitter = 40 }
speed = 0
coolant = { value = 78, jitter = 0.5 }
throttle = 5
runtime = 180
battery = { value = 13.9, jitter = 0.05 }

[dtcs]
stored = []

[monitors]
misfire = "complete"
fuel_system = "complete"
components = "complete"
