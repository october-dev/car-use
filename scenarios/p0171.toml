notes = """P0171 system too lean, bank 1. Long-term trim is pegged high at idle and
falls toward normal as airflow rises: the classic signature of an unmetered
air (vacuum) leak, which matters most at low airflow. A weak fuel pump or
clogged injectors would instead get worse under load."""

